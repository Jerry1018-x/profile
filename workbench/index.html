<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的 AI 工作台 · 公开演示</title>
  <link rel="stylesheet" href="workbench.css">
  <link rel="stylesheet" href="demo.css">
  <script defer src="cats.js"></script>
  <script defer src="demo.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo"><span class="logo-mark" aria-hidden="true">✦</span><div class="logo-text"><b>个人工作台</b><span>求职 · 学习 · 创作</span></div></div>
      <nav aria-label="工作台页面">
        <a href="#knowledge">AI 知识库</a>
        <a href="#directions">求职方向</a>
        <a href="#media">媒体规划</a>
      </nav>
    </aside>
    <main id="main">
      <section id="knowledge">
        <div class="page-head"><h2>AI 知识库</h2></div>
        <div class="card kb-mango-card">
          <div class="kb-cat-box" data-cat="mango"></div>
          <div><div class="kb-mango-title">芒果 · 知识库管家</div><p>跟着博主学习，把想复习的内容写进笔记。</p></div>
        </div>
        <div class="section-head"><h3>推荐博主</h3></div>
        <div class="kb-blogger-list">
          <div class="kb-blogger-row"><b class="kb-blogger-name">跟李沐学AI</b><span class="kb-blogger-meta">B站 · 论文精读</span><div class="kb-blogger-summary">从论文精读开始，理解深度学习的基本方法。</div></div>
          <div class="kb-blogger-row"><b class="kb-blogger-name">同济子豪兄</b><span class="kb-blogger-meta">B站 · 视觉实战</span><div class="kb-blogger-summary">通过计算机视觉教程动手复现模型。</div></div>
        </div>
        <div class="section-head"><h3>学习笔记</h3></div>
        <form class="card" id="note-form">
          <label for="note">试写一条笔记（仅本次浏览可见）</label>
          <div class="demo-form-row"><input id="note" maxlength="180" required autocomplete="off" placeholder="下次想深入了解什么？"><button class="btn primary" type="submit">添加笔记</button></div>
          <ul id="notes" aria-live="polite"></ul>
        </form>
      </section>
      <section id="directions" hidden>
        <div class="page-head"><h2>求职方向</h2></div>
        <div class="card"><h3>行业偏好</h3><p>选择要屏蔽的行业，下方的示例岗位会随之更新。</p>
          <div id="industry-options" aria-label="屏蔽行业"></div></div>
        <div class="section-head"><h3>匹配岗位</h3></div>
        <ul class="kb-blogger-list" id="jobs" aria-live="polite"></ul>
      </section>
      <section id="media" hidden>
        <div class="page-head"><h2>媒体规划</h2></div>
        <div class="card media-shanzhu"><div class="kb-cat-box" data-cat="shanzhu"></div>
          <div><div class="kb-mango-title">山竹 · 账号数据分析师</div><p>选一个平台，查看示例内容的阅读表现。</p></div></div>
        <div class="section-head"><h3>账号复盘</h3></div>
        <div class="card"><label for="platform">内容平台</label> <select id="platform"><option>小红书</option><option>B站</option></select>
          <div id="metrics" aria-live="polite"></div></div>
      </section>
    </main>
  </div>
</body>
</html>
